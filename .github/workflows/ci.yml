name: Package and CPU compatibility

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate for a requested release
        required: false
        type: string

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            torch: "2.4.1"
            transformers: "4.51.3"
            numpy: "1.26.4"
          - python: "3.12"
            torch: "2.8.0"
            transformers: "4.51.3"
            numpy: "2.5.3"
          - python: "3.12"
            torch: "2.8.0"
            transformers: "4.56.2"
            numpy: "2.5.3"
    steps:
      # Official refs verified 2026-10-02: actions/checkout v4 and setup-python v5.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,trainer,wandb,research]" "torch==${{ matrix.torch }}" "transformers==${{ matrix.transformers }}" "numpy==${{ matrix.numpy }}" "accelerate==1.10.1" "wandb==0.30.0"
      - name: Test
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          WANDB_MODE: offline
        run: python -m pytest -q
      - name: Build and inspect local distributions
        run: |
          python -m build
          python -m twine check dist/*
          python tools/check_release.py --dist-dir dist
      - name: Test wheel in a fresh consumer environment
        env:
          CONSUMER: ${{ runner.temp }}/rope-profiler-consumer
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m venv "$CONSUMER"
          "$CONSUMER/bin/python" -m pip install --upgrade pip
          "$CONSUMER/bin/python" -m pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          "$CONSUMER/bin/python" -m pip install --no-deps "$CHECKOUT"/dist/*.whl
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$CONSUMER/bin/python" -I "$CHECKOUT/tools/wheel_smoke.py"
      # This retains local build outputs for inspection; it does not publish a package.
      # Official actions/upload-artifact v4 ref verified 2026-10-02.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-py${{ matrix.python }}-torch${{ matrix.torch }}-hf${{ matrix.transformers }}
          path: dist/*
