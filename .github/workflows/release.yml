name: Build a reviewed release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag matching the package version, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.release_tag }}

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install build twine "packaging>=24.2"
      - name: Verify tag, version and license
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os, runpy, subprocess
          expected = 'v' + runpy.run_path('src/rope_profiler/_version.py')['__version__']
          requested = os.environ['RELEASE_TAG']
          if requested != expected:
              raise SystemExit('release tag must match package version: ' + expected)
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + requested + '^{commit}'], text=True).strip()
          if revision != tagged:
              raise SystemExit('checkout does not match requested release tag')
          PY
          python tools/check_release.py --require-license
      - name: Build and freeze candidate artifacts
        run: |
          python -m build
          python -m twine check dist/*
          python tools/prepare_release.py --dist-dir dist --output-dir candidate --mode release
      - name: Verify this candidate wheel as a consumer
        env:
          CONSUMER: ${{ runner.temp }}/release-consumer
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m venv "$CONSUMER"
          "$CONSUMER/bin/python" -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          "$CONSUMER/bin/python" -m pip install --no-deps "$CHECKOUT"/candidate/*.whl
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$CONSUMER/bin/python" -I "$CHECKOUT/tools/wheel_smoke.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: candidate/*
          retention-days: 90
