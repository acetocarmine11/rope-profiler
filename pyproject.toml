[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rope-profiler"
dynamic = ["version"]
description = "Sampled RoPE diagnostics during existing model evaluation passes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
dependencies = ["torch>=2.4,<3"]
keywords = ["rope", "language-models", "training", "evaluation", "activation-monitoring"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/acetocarmine11/rope-profiler"
Issues = "https://github.com/acetocarmine11/rope-profiler/issues"
Documentation = "https://github.com/acetocarmine11/rope-profiler/blob/main/README.md"
Paper = "https://arxiv.org/abs/2609.39929"

[project.optional-dependencies]
trainer = ["transformers>=4.51,<4.57", "accelerate>=1.3,<2"]
wandb = ["wandb>=0.19,<1"]
research = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8", "build>=1", "twine>=6", "packaging>=24.2", "tomli>=2; python_version<'3.11'"]

[tool.setuptools.dynamic]
version = {attr = "rope_profiler._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rope_profiler = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
